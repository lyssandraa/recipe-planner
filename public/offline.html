<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline - Recipe Planner</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFF8EE;
    color: #22331F;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    text-align: center;
    padding: 32px;
    max-width: 320px;
  }
  .emoji { font-size: 48px; }
  h1 { font-size: 18px; margin: 12px 0 4px; }
  p { font-size: 14px; color: #7C8A78; margin: 0; }
  button {
    margin-top: 20px;
    background: #2F5E3A;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">📡</div>
    <h1>No connection</h1>
    <p>This page needs a connection to load fresh data. Try again once you're back online.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
